<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" width="120" height="300">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes swing {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes eyePulse {
      0%, 85%, 100% { opacity: 1; }
      90% { opacity: 0.1; }
    }
    @keyframes threadDraw {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes legTwitch1 {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(5deg); }
      70% { transform: rotate(-3deg); }
    }
    @keyframes legTwitch2 {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-4deg); }
      60% { transform: rotate(6deg); }
    }
    @keyframes descend {
      0% { opacity: 0; transform: translateY(-50px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    #spider-swing {
      transform-origin: 80px 10px;
      animation: swing 4s ease-in-out infinite, descend 2s ease-out forwards;
    }
    .eye-glow { animation: eyePulse 5s infinite; }
    .legs-left { transform-origin: 60px 230px; animation: legTwitch1 3s ease-in-out infinite; }
    .legs-right { transform-origin: 100px 230px; animation: legTwitch2 3.5s ease-in-out infinite; }
    .web-thread { animation: threadDraw 2s ease-out forwards; stroke-dasharray: 400; }
  </style>

  <!-- Small web pattern at anchor point -->
  <g opacity="0.4">
    <line x1="80" y1="0" x2="60" y2="20" stroke="#666" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="100" y2="20" stroke="#666" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="25" stroke="#666" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="50" y2="10" stroke="#666" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="110" y2="10" stroke="#666" stroke-width="0.5"/>
    <path d="M55 12 Q80 18 105 12" fill="none" stroke="#666" stroke-width="0.5"/>
    <path d="M62 20 Q80 28 98 20" fill="none" stroke="#666" stroke-width="0.5"/>
  </g>

  <!-- Swinging spider group -->
  <g id="spider-swing">
    <!-- Thread -->
    <line class="web-thread" x1="80" y1="10" x2="80" y2="200" stroke="#999" stroke-width="1.2"/>

    <!-- Spider body at bottom of thread -->
    <g transform="translate(80, 220)">

      <!-- LEGS - Left Side (pixel angular style) -->
      <g class="legs-left">
        <!-- Leg 1 - top left, reaches up and out -->
        <polyline points="-6,-14 -14,-22 -26,-18 -36,-28 -44,-22" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
        <!-- Leg 2 -->
        <polyline points="-8,-6 -18,-8 -30,-2 -40,-8 -48,0" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
        <!-- Leg 3 -->
        <polyline points="-8,6 -18,8 -30,4 -40,12 -48,6" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
        <!-- Leg 4 - bottom left, reaches down and out -->
        <polyline points="-6,14 -14,22 -26,20 -36,30 -44,26" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
      </g>

      <!-- LEGS - Right Side -->
      <g class="legs-right">
        <polyline points="6,-14 14,-22 26,-18 36,-28 44,-22" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
        <polyline points="8,-6 18,-8 30,-2 40,-8 48,0" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
        <polyline points="8,6 18,8 30,4 40,12 48,6" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
        <polyline points="6,14 14,22 26,20 36,30 44,26" fill="none" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="bevel"/>
      </g>

      <!-- ABDOMEN (back/lower body) - pixel blocks -->
      <rect x="-6" y="4" width="12" height="4" rx="0" fill="#16162a"/>
      <rect x="-10" y="8" width="20" height="4" rx="0" fill="#16162a"/>
      <rect x="-12" y="12" width="24" height="4" rx="0" fill="#1a1a32"/>
      <rect x="-14" y="16" width="28" height="4" rx="0" fill="#1e1e38"/>
      <rect x="-14" y="20" width="28" height="4" rx="0" fill="#1a1a32"/>
      <rect x="-12" y="24" width="24" height="4" rx="0" fill="#16162a"/>
      <rect x="-10" y="28" width="20" height="4" rx="0" fill="#16162a"/>
      <rect x="-6" y="32" width="12" height="4" rx="0" fill="#12122a"/>
      <!-- Abdomen markings (pixel pattern) -->
      <rect x="-2" y="12" width="4" height="4" fill="#2a2a4a" opacity="0.6"/>
      <rect x="-6" y="20" width="4" height="4" fill="#2a2a4a" opacity="0.4"/>
      <rect x="2" y="20" width="4" height="4" fill="#2a2a4a" opacity="0.4"/>
      <rect x="-2" y="28" width="4" height="4" fill="#2a2a4a" opacity="0.3"/>

      <!-- CEPHALOTHORAX (head/front body) - pixel blocks -->
      <rect x="-8" y="-4" width="16" height="4" rx="0" fill="#1a1a30"/>
      <rect x="-10" y="-8" width="20" height="4" rx="0" fill="#1e1e36"/>
      <rect x="-12" y="-12" width="24" height="4" rx="0" fill="#1e1e36"/>
      <rect x="-12" y="-16" width="24" height="4" rx="0" fill="#1a1a32"/>
      <rect x="-10" y="-20" width="20" height="4" rx="0" fill="#16162a"/>
      <rect x="-6" y="-24" width="12" height="4" rx="0" fill="#12122a"/>

      <!-- EYES - glowing red pixel eyes -->
      <g class="eye-glow" filter="url(#eyeGlow)">
        <!-- Left eye -->
        <rect x="-8" y="-18" width="5" height="5" fill="#ff0040"/>
        <rect x="-7" y="-17" width="2" height="2" fill="#ff6688"/>
        <!-- Right eye -->
        <rect x="3" y="-18" width="5" height="5" fill="#ff0040"/>
        <rect x="4" y="-17" width="2" height="2" fill="#ff6688"/>
      </g>

      <!-- CHELICERAE (fangs) - small pixel blocks -->
      <rect x="-4" y="-2" width="2" height="4" fill="#2a1a1a"/>
      <rect x="2" y="-2" width="2" height="4" fill="#2a1a1a"/>
      <rect x="-3" y="2" width="1" height="2" fill="#3a2020"/>
      <rect x="2" y="2" width="1" height="2" fill="#3a2020"/>

      <!-- PEDIPALPS (small front appendages) -->
      <rect x="-10" y="-6" width="3" height="2" fill="#1a1a2e"/>
      <rect x="7" y="-6" width="3" height="2" fill="#1a1a2e"/>
    </g>
  </g>

  <!-- Tiny silk droplet at bottom -->
  <g id="spider-swing">
    <circle cx="80" cy="260" r="0" fill="#aaa" opacity="0">
      <animate attributeName="r" values="0;1.5;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="255;270;255" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
